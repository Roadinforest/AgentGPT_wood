[tool.poetry]
name = "reworkd_platform"
version = "0.1.0"
description = ""
authors = ["awtkns", "asim-shrestha"]
maintainers = ["reworkd"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
# FastAPI: 为了配合 Pydantic v1，尽量保持在 0.100 以下，或者严格锁定
fastapi = ">=0.98.0,<0.100.0"
# Uvicorn: 这是一个运行服务器，通常较新版本兼容性较好
uvicorn = { version = "^0.22.0", extras = ["standard"] }
# Pydantic: 必须严格锁定在 v1，因为源码是基于 v1 编写的
pydantic = { version = "^1.10.0", extras = ["dotenv"] }
# OpenAI: 必须锁定在 1.0.0 之前，因为 1.0 修改了所有调用方式 (client.chat...)
openai = ">=0.28.0,<1.0.0"
# LangChain: 0.1.0 之后架构变动巨大，需锁定在 0.0.x 系列以兼容源码
langchain = ">=0.0.295,<0.1.0"
# Pinecone: v3 版本有重大变动，锁定在 v2
pinecone-client = "^2.2.4"
# Lanarky: 此库已不再积极维护，且依赖较旧的 Langchain/FastAPI
lanarky = "^0.7.15"

# 其他核心依赖
boto3 = "^1.28.51"
botocore = "^1.31.51"
ujson = "^5.8.0"
sqlalchemy = { version = "^2.0.21", extras = ["mypy", "asyncio"] }
aiomysql = "^0.1.1"
mysqlclient = "^2.2.0"
sentry-sdk = "^1.31.0"
loguru = "^0.7.2"
aiokafka = "^0.8.1"
requests = "^2.31.0"
wikipedia = "^1.4.0"
replicate = "^0.8.4"
tiktoken = "^0.5.1"
grpcio = "^1.58.0"
python-multipart = "^0.0.6"
aws-secretsmanager-caching = "^1.1.1.5"
stripe = "^5.5.0"
cryptography = "^41.0.4"
httpx = "^0.25.0"

# [注意] 将原有的 [tool.poetry.dev-dependencies] 合并到了新的 group 语法中
[tool.poetry.group.dev.dependencies]
autopep8 = "^2.0.4"
pytest = "^7.4.2"
# Flake8: wemake-python-styleguide 依赖特定的 flake8 版本，不能太高
flake8 = "~6.0.0" 
mypy = "^1.5.1"
isort = "^5.12.0"
pre-commit = "^3.4.0"
wemake-python-styleguide = "^0.18.0"
black = "^23.9.1"
autoflake = "^2.2.1"
pytest-cov = "^4.1.0"
anyio = "^3.7.1"
pytest-env = "^0.8.2"
dotmap = "^1.3.30"
pytest-mock = "^3.10.0"
pytest-asyncio = "^0.21.0"
types-requests = "^2.31.0.1"
types-pytz = "^2023.3.0.0"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["reworkd_platform"]

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true
exclude = "tests"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
    "ignore::ImportWarning",
]
env = [
    "REWORKD_PLATFORM_DB_BASE=reworkd_platform_test",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default=true